<!doctype html>
<html lang="en" data-default-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liner Notes: a private deep dive into your Spotify streaming history</title>
    <meta name="description" content="Import your Spotify Extended Streaming History. Top tracks for any dates, skips, first listens, lost favourites, eras, streaks, and a Wrapped you can fix by excluding sleep sounds, kids' songs and more. Private: raw history stays in your browser." />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%231ed760'/><text x='16' y='21' font-family='Arial,sans-serif' font-size='13' font-weight='900' text-anchor='middle' fill='black'>LN</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : document.documentElement.dataset.defaultMode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
